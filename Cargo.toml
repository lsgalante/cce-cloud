[package]
name = "cce-cloud"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "bfafde060f994e35e7c1fcd5ae177125f6bcaa99" }
smithay-client-toolkit = "0.19.2"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[lints.clippy]
# The toolkit's house style (cce-ui's [lints.clippy]): state and geometry
# taken piecewise, and the tuple views.
too_many_arguments = "allow"
type_complexity = "allow"
